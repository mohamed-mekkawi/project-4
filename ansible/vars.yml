
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_apt_dependencies:
  - ca-certificates
  - curl

docker_repo_url: "https://download.docker.com/linux/ubuntu"
docker_repo_keyring: /etc/apt/keyrings/docker.asc
docker_apt_arch: amd64
docker_apt_release: noble

deployment_dir: /opt/myapp
